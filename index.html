<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>De (Nova) Mensa Populari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: una colonna su telefono, griglia di schede su desktop; ricetta e menù si aprono a tutta pagina */
:root{
  --bg:#f3f5f1;
  --surface:#ffffff;
  --ink:#1c2621;
  --muted:#5b6a62;
  --line:#d8dfd9;
  --accent:#2f6b4f;
  --accent-ink:#ffffff;
  --accent-soft:#e1ede6;
  --tomato:#b8432e;
  --tomato-soft:#f8e5df;
  --tile:#e9efe6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131915; --surface:#1c2420; --ink:#e6ece8; --muted:#9caea4; --line:#2d3933;
    --accent:#6fbf94; --accent-ink:#0f1a14; --accent-soft:#22382c; --tomato:#ef8a72; --tomato-soft:#3a2420; --tile:#25312a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1c2420; --ink:#e6ece8; --muted:#9caea4; --line:#2d3933;
  --accent:#6fbf94; --accent-ink:#0f1a14; --accent-soft:#22382c; --tomato:#ef8a72; --tomato-soft:#3a2420; --tile:#25312a;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
/* ---------- Timer ---------- */
.tabs .tm-open{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:7px 9px;border-radius:9px;position:relative}
.tm-badge{position:absolute;top:0;right:0;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;line-height:15px;text-align:center;padding:0 3px}
.lcd{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.lcd svg{display:block}
.lcd .on{fill:currentColor}.lcd .off{fill:currentColor;opacity:.08}
.tm-dock{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.tm-pill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:#151a17;color:#ff5a36;border:0;border-radius:12px;padding:6px 10px 6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;font:inherit}
.tm-pill .tm-n{color:#d9e0dc;font-size:12px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-pill.pausa{color:#9aa6a0}
.tm-ring{animation:tmflash .45s steps(1,end) infinite alternate}
@keyframes tmflash{0%{background:#151a17;color:#ff5a36}100%{background:#ff5a36;color:#151a17}}
.tm-pill.tm-ring .tm-n{color:inherit}
.tm-modal{position:fixed;inset:0;z-index:90;background:rgba(20,30,25,.45);display:flex;align-items:flex-end;justify-content:center}
.tm-sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.tm-modal{align-items:center}.tm-sheet{border-radius:18px}}
.tm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.tm-head h2{margin:0;font-size:22px}
.tm-x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.tm-card{background:#151a17;color:#ff5a36;border-radius:14px;padding:12px;margin-bottom:10px}
.tm-card.pausa,.tm-card.fermo{color:#c9d2cd}
.tm-card .tm-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tm-card input.tm-name{flex:1;background:transparent;border:0;border-bottom:1px solid #3a433e;color:#e8eeea;font:inherit;font-weight:700;padding:3px 0}
.tm-card .tm-big{display:flex;justify-content:center;padding:6px 0 10px}
.tm-card .tm-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tm-card button{background:#2a322d;color:#e8eeea;border:0;border-radius:9px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.tm-card button.go{background:#ff5a36;color:#151a17}
.tm-card button.del{background:none;color:#9aa6a0;padding:4px 6px}
.tm-comp{background:#151a17;color:#ff5a36;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.tm-comp .tm-name{background:transparent;border:0;border-bottom:1px solid #3a433e;color:#e8eeea;font:inherit;font-weight:700;padding:4px 0}
.tm-comp .tm-name::placeholder{color:#7d8984}
.tm-comp .tm-big{display:flex;justify-content:center;padding:4px 0}
.tm-comp .tm-big.vuoto{opacity:.35}
.tm-hint{margin:0;font-size:13px;color:#9aa6a0;text-align:center}
.tm-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tm-pad button{background:#2a322d;color:#e8eeea;border:0;border-radius:12px;padding:14px 0;font:inherit;font-size:22px;font-weight:700;cursor:pointer}
.tm-pad button:active{background:#3a433e}
.tm-go{background:#ff5a36;color:#151a17;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.tm-go:disabled{opacity:.4;cursor:default}
@media (hover:hover) and (pointer:fine){.tm-pad{display:none}}
@media (pointer:coarse){.tm-kbd{display:none}}
.tm-card .tm-top{justify-content:space-between}
.tm-card .tm-top .tm-name{min-width:0}
.tm-card .tm-top .tm-big{padding:0;flex:0 0 auto}
.tm-card .tm-btns button.wide{flex:1 1 90px}
.tm-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:120;background:#151a17;color:#e8eeea;padding:10px 14px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:.25s;pointer-events:none}
.tm-toast.on{opacity:1;transform:translate(-50%,0)}
.tm-tel{display:inline-flex;align-items:center;justify-content:center;background:#2a322d;border-radius:9px;padding:6px 10px;text-decoration:none;font-size:16px}
.tm-note{font-size:13px;color:var(--muted);margin:10px 0 0}

.dot-modal{position:fixed;inset:0;z-index:100;background:rgba(20,30,25,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dot-box{background:var(--bg);border-radius:18px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dot-box h2{margin:0;font-size:22px}.dot-box p{margin:0 0 4px;color:var(--muted)}
.dot-box .btn{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;width:100%;height:auto;padding:12px 14px}
.dot-box .btn small{font-weight:400;font-size:13px;opacity:.85}
.dot-box .link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;align-self:center;padding:6px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:600}
a{color:inherit}

/* Testata */
.masthead{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0 14px;border-bottom:3px double var(--line);margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{flex:0 0 auto}
.logo b{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.01em;line-height:1.05}
.logo small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tabs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.tabs a{padding:7px 16px;border-radius:9px;text-decoration:none;font-weight:700;font-size:15px;color:var(--muted)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* Filtri */
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.search{position:relative;display:block}
.search input{width:100%;padding:13px 14px 13px 42px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips.wrapchips{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.subchips .chip{font-size:14px;padding:5px 12px;border-style:dashed}
.subchips .chip[aria-pressed="true"]{border-style:solid}

/* Elenco ricette */
.section-block{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.section-title{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.section-title span{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;flex-direction:row;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit}
.card:hover{border-color:var(--accent)}
.card .art{background:var(--tile);flex:0 0 92px;align-self:stretch;min-height:84px;display:grid;place-items:center}
.card .art svg{width:86%;height:auto}
.card .txt{display:flex;flex-direction:column;gap:3px;padding:10px 12px;min-width:0}
.card h3{font-size:17px}
.path{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.card .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.card .meta span{display:inline-flex;align-items:center;gap:4px}
.empty{color:var(--muted);font-style:italic;padding:4px 0;margin:0}
.hint{margin-top:30px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:15px}

/* Scheda ricetta */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:10px;text-decoration:none}
.hero{display:grid;grid-template-columns:1fr;gap:16px;align-items:center;margin-bottom:18px}
@media (min-width:760px){.hero{grid-template-columns:240px 1fr}}
.hero .art{background:var(--tile);border-radius:16px;display:grid;place-items:center;aspect-ratio:4/3;max-width:240px;width:100%}
.hero .art svg{width:80%;height:auto}
.hero .head{display:flex;flex-direction:column;gap:8px}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.recap{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media (min-width:760px){.recap{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.recap{grid-template-columns:1fr}}
.rc{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rc .lab{display:flex;align-items:center;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.rc .big{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.rc .sub{font-size:14px;color:var(--muted)}
.rc ul{margin:0;padding-left:18px;font-size:15px}
.warn{background:var(--tomato-soft);border-left:4px solid var(--tomato);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:18px;font-size:15px}
.warn b{color:var(--tomato)}
.warn ul{margin:6px 0 0;padding-left:18px}
.recipe-body{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:860px){.recipe-body{grid-template-columns:minmax(330px,410px) 1fr;align-items:start}.panel.ing{position:sticky;top:12px}}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.scaler{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;margin-bottom:6px;border-bottom:1.5px solid var(--line)}
.scaler-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;height:40px;border:none;background:var(--accent-soft);cursor:pointer;font-size:20px;font-weight:700;color:var(--accent)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.teglia{display:flex;flex-direction:column;gap:10px}
.teglia .qty input{width:52px}
.stepper input{width:70px;height:40px;border:none;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface)}
.stepper input:focus{outline:none;background:var(--accent-soft)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:14px}
.quick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.factor{font-size:14px;color:var(--muted)}
.factor b{color:var(--tomato)}
.tip{font-size:13px;color:var(--muted);margin:0}
.group{margin-top:12px}
.group h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.ing-list{list-style:none;margin:0;padding:0}
.ing-list li{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.ing-list li:last-child{border-bottom:none}
.qty{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.qty input{width:64px;padding:3px 4px;border:none;border-bottom:2px solid var(--accent);background:transparent;font-weight:700;text-align:right}
.qty input:focus{outline:none;background:var(--accent-soft)}
.qty .u{font-size:14px;color:var(--muted)}
.qb{font-weight:700;color:var(--muted)}
.ing-name small{display:block;color:var(--muted);font-size:14px}
.total{display:flex;justify-content:flex-end;align-items:baseline;gap:6px;margin-top:6px;font-size:14px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;max-width:68ch}
.steps li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.notes{margin-top:18px}
.notes ul{margin:8px 0 0;padding-left:20px;max-width:68ch}
.notes li{margin-bottom:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:var(--surface);color:var(--tomato);border:1.5px solid var(--tomato)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.status{font-size:14px;color:var(--muted)}
.rc-time{grid-column:1 / -1}
.fasi{list-style:none;margin:4px 0 0;padding:0;font-size:14px;columns:2 300px;column-gap:28px}
.fasi li{break-inside:avoid}
.fasi li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.fasi li:last-child{border-bottom:none}
.fasi li b{white-space:nowrap;font-variant-numeric:tabular-nums}
.fasi li.par{color:var(--muted);font-style:italic}
.prima-lab{margin:8px 0 2px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);column-span:all}
.prima-lab span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.fasi.prima li{color:var(--muted)}
.forno-steps{columns:1}
.scheda{margin-top:28px;padding-top:18px;border-top:3px double var(--line);scroll-margin-top:calc(var(--mh,0px) + 64px)}
.sh{font-size:26px;margin:4px 0 6px}
.ph{font-size:17px;margin-bottom:8px}
.induzione{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:15px}
.induzione summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
.induzione[open] summary{margin-bottom:8px}
.sticky-chips{position:sticky;top:var(--mh,0px);z-index:5;background:var(--bg);padding:8px 0;margin:0 -2px 6px;border-bottom:1.5px solid var(--line)}
.prezzo-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.prezzo-box .tip{flex:1 1 100%}
.chiuso-tip{color:var(--tomato)}
.pad{display:block;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.settings{display:flex;flex-direction:column;gap:14px;max-width:640px}
.settings .ck{align-items:flex-start}
.settings .ck input{margin-top:3px}
.induzione ul{margin:6px 0;padding-left:20px;max-width:72ch}
.induzione .diff{background:var(--tomato-soft);border-left:4px solid var(--tomato);border-radius:0 10px 10px 0;padding:10px 12px;margin-top:10px}
.induzione .diff b{color:var(--tomato)}
.ninja-chip.ind-chip{background:var(--accent);color:var(--accent-ink)}
.knob li{align-items:flex-start}
.scatti{flex:0 0 30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.knob li > span:nth-child(2){flex:1}
.en{color:var(--muted);font-weight:400}
.ninja-chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 7px;vertical-align:middle}
.ninja-chip.off{background:var(--line);color:var(--muted)}
.ninja{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:15px}
.ninja.ok{border-color:var(--ink)}
.ninja summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
.ninja-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.ninja-grid div{display:flex;flex-direction:column}
.ninja .lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.ninja ol{margin:8px 0;padding-left:20px;max-width:70ch}
.ninja ol li{margin-bottom:6px}
.pencil{background:none;border:none;color:var(--accent);cursor:pointer;padding:2px 4px;vertical-align:middle}
.title-edit{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.title-edit input{flex:1 1 260px;font-family:var(--display);font-size:22px;font-weight:800;padding:6px 10px;border:1.5px solid var(--accent);border-radius:10px;background:var(--surface)}
.btn.small{padding:5px 12px;font-size:14px}
.tabs{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs a{white-space:nowrap;flex:0 0 auto}
@media (max-width:480px){.tabs a{padding:7px 9px;font-size:14px}.masthead{gap:8px}}
.tree{display:flex;flex-direction:column;gap:14px}
.tree-group{border-top:1.5px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.tree-group h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tree-sez{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.tree-sub{margin-left:22px;display:flex;flex-direction:column;gap:4px}
.tree-items{margin-left:22px;display:flex;flex-direction:column;gap:2px}
.tree-sez > .tree-sub:has(> .tree-items:first-child) {margin-left:0}
.ck{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.ck .n{color:var(--muted);font-size:14px}
.trash{margin-top:28px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.trash summary{cursor:pointer;font-weight:700;color:var(--muted)}
.trash ul{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.trash li{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Menù */
.menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.mcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;display:flex;flex-direction:column;gap:8px}
.mcard:hover{border-color:var(--accent)}
.thumbs{display:flex;gap:6px}
.thumbs span{width:46px;height:36px;border-radius:8px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.thumbs svg{width:90%;height:auto}
.wizard-step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:6px}
.frigo-chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.frigo-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.frigo-chip[aria-pressed="true"]::before{content:"✓";color:var(--accent)}
.pick{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pick .th{width:64px;height:50px;border-radius:10px;background:var(--tile);display:grid;place-items:center}
.pick .th svg{width:92%;height:auto}
.pick .mt{font-size:14px;color:var(--muted)}
.pick .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--accent-ink)}
.pick[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px;max-width:180px}
.bar i{display:block;height:100%;background:var(--accent)}
.picks{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;max-width:420px}
.field input{padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.field input:focus{border-color:var(--accent);outline:none}
.shop{columns:2 220px;margin:8px 0 0;padding-left:20px}
.shop li{break-inside:avoid;margin-bottom:4px}
.shop small{color:var(--muted)}
.sticky-bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1.5px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
@media (max-width:560px){.grid{grid-template-columns:1fr;gap:10px}.card .art{flex-basis:80px}}
@media (prefers-reduced-motion:no-preference){.card,.mcard,.pick{transition:border-color .15s}}

function fmt(n){
  if (n == null) return "";
  const v = n >= 10 ? Math.round(n) : Math.round(n * 10) / 10;
  return String(v).replace(".", ",");
}
function parseNum(s){ const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) && v > 0 ? v : null; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function porzLabel(r, n){ return r.unitaPorzioni[Math.abs(n - 1) < 1e-9 ? 0 : 1]; }
function dur(m){ if (!m) return "0 min"; const h = Math.floor(m / 60), mm = m % 60; return h ? `${h} h${mm ? " " + mm + " min" : ""}` : `${mm} min`; }
function acciaio(){ try { return localStorage.getItem("ricettario-padelle") !== "antiaderente"; } catch (e){ return true; } }
function mostraConsumi(){ try { return localStorage.getItem("ricettario-consumi") !== "no"; } catch (e){ return true; } }
function setConsumi(v){ try { localStorage.setItem("ricettario-consumi", v ? "si" : "no"); } catch (e) {} }
function setPadelle(v){ try { localStorage.setItem("ricettario-padelle", v ? "acciaio" : "antiaderente"); } catch (e) {} }
let DOT = null; /* dotazione forzata per il PDF: "casa" | "gen" | null */
function impostaProfilo(p){ try {
  localStorage.setItem("ricettario-profilo", p);
  if (p === "federico"){ localStorage.setItem("ricettario-fornocasa", "si"); localStorage.setItem("ricettario-induzione", "si"); localStorage.setItem("ricettario-consumi", "no"); if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) localStorage.setItem("ricettario-telsveglia", "iphone"); }
  else { localStorage.setItem("ricettario-consumi", "si"); localStorage.setItem("ricettario-telsveglia", "no"); }
  sessionStorage.setItem("ricettario-chiesto", "1"); } catch (e) {} }
function chiediProfilo(){ try { if (sessionStorage.getItem("ricettario-chiesto")) return; } catch (e) {}
  const d = document.createElement("div"); d.className = "dot-modal";
  d.innerHTML = `<div class="dot-box" role="dialog" aria-modal="true" aria-labelledby="pf-t"><h2 id="pf-t">Sei Federico?</h2>
    <p>Così ti mostro il ricettario giusto.</p>
    <button class="btn" data-pf="federico"><b>Sì, sono Federico</b><small>ricette per il forno IKEA, il piano a induzione e il Ninja, timer collegato all'orologio del telefono, senza consumi</small></button>
    <button class="btn ghost" data-pf="altro"><b>No</b><small>ricette per una cucina qualsiasi, con i consumi; il timer lo imposti tu</small></button></div>`;
  document.body.appendChild(d);
  d.addEventListener("click", e => { const b = e.target.closest("[data-pf]"); if (!b) return; impostaProfilo(b.dataset.pf); d.remove(); if (location.hash === "#elettrodomestici" && b.dataset.pf !== "federico") location.hash = ""; route(); });
  d.querySelector("[data-pf=federico]").focus(); }
function profilo(){ try { return localStorage.getItem("ricettario-profilo") || ""; } catch (e){ return ""; } }
function federico(){ return profilo() !== "altro"; }
function showNinja(){ return DOT ? DOT === "casa" : federico(); }
function fornoCasa(){ if (DOT) return DOT === "casa"; if (!federico()) return false; try { return localStorage.getItem("ricettario-fornocasa") !== "no"; } catch (e){ return true; } }
function induzioneCasa(){ if (DOT) return DOT === "casa"; if (!federico()) return false; try { return localStorage.getItem("ricettario-induzione") !== "no"; } catch (e){ return true; } }
function setFlag(k, v){ try { localStorage.setItem(k, v ? "si" : "no"); } catch (e) {} }
function V(x){ if (x && typeof x === "object" && x.casa) return V((x.casa === "forno" ? fornoCasa() : induzioneCasa()) ? x.si : x.no); return x && typeof x === "object" && x.padella ? x[acciaio() ? "acciaio" : "antiaderente"] : x; }
function cot(r){ const c = r.cottura; const casa = c.tipo === "forno" ? fornoCasa() : c.tipo === "fornelli" ? induzioneCasa() : true; return casa || !c.gen ? c : { tipo: c.tipo, dettaglio: c.gen.dettaglio, extra: c.gen.extra }; }
function showPiastra(r){ return !!r.piastra && induzioneCasa(); }
function VL(list){ return (Array.isArray(list) ? list : list ? [list] : []).flatMap(x => { const v = V(x); return Array.isArray(v) ? v : [v]; }); }
function usaPadelle(r){ return JSON.stringify([r.strumenti, r.procedimento, r.piastra || null]).includes('"padella":true'); }
function tRange(r){ let a = 0, b = 0; for (const f of r.fasi || []) if (!f.parallelo && !f.prima){ a += f.min; b += (f.max ?? f.min); } return [a, b]; }
function primaRange(r){ let a = 0, b = 0; for (const f of r.fasi || []) if (f.prima && !f.parallelo){ a += f.min; b += (f.max ?? f.min); } return [a, b]; }
function totMin(r){ return tRange(r)[0]; }
function durAB(a, b){ return a === b ? dur(a) : `${dur(a)} – ${dur(b)}`; }
function durR(r){ const [a, b] = tRange(r); return durAB(a, b); }
function faseDur(f){ return durAB(f.min, f.max ?? f.min); }
function ingCount(r){ return r.gruppi.reduce((n, g) => n + g.ingredienti.length, 0); }
function pathOf(r){ return `${r.sezione}${r.sottosezione ? " · " + esc(r.sottosezione) : ""}`; }
function allIng(r){ return r.gruppi.flatMap(g => g.ingredienti); }

/* Frigo: tutti gli ingredienti presi dalle ricette (escluso ciò che è sempre in casa) */
const VIS = () => RICETTE.filter(r => !cestino.has(r.id));
const FRIGO_ALL = () => [...new Set(VIS().flatMap(r => allIng(r).filter(i => !i.base && i.k).flatMap(i => i.k)))].sort((a, b) => a.localeCompare(b, "it"));

function match(r, frigo){
  const need = allIng(r).filter(i => !i.base && i.k);
  const have = need.filter(i => i.k.some(k => frigo.has(k)));
  const miss = need.filter(i => !i.k.some(k => frigo.has(k)));
  return { tot: need.length, have: have.length, miss };
}

function filtered(){
  const q = norm(state.q.trim());
  return VIS().filter(r => {
    if (state.sezione !== "Tutte" && r.sezione !== state.sezione) return false;
    if (state.sotto && r.sottosezione !== state.sotto) return false;
    if (!q) return true;
    const hay = norm([r.titolo, r.sezione, r.sottosezione || "", ...allIng(r).map(i => i.nome)].join(" "));
    return q.split(/\s+/).every(w => hay.includes(w));
  }).sort((a, b) => a.titolo.localeCompare(b.titolo, "it"));
}

  for (const s of sez){
    const items = list.filter(r => r.sezione === s);
    if ((state.q || state.sezione === "Tutte") && !items.length) continue;
    html += `<section class="section-block"><div class="section-title"><h2>${s}</h2><span>${items.length}</span></div>`;

  document.getElementById("q").addEventListener("input", e => {

/* ---------- Scheda ricetta ---------- */
function tgState(r){ if (!state.tg) state.tg = {}; if (!state.tg[r.id]) state.tg[r.id] = { ...r.cont, h: 0 }; return state.tg[r.id]; }
function tgUsaH(r){ const t = tgState(r); return r.cont.nome === "stampo" && t.h > 0 && r.cont.h > 0; }
function tgArea(t){ return t.forma === "tonda" ? (t.d / 2) * (t.d / 2) * 3.14 : t.a * t.b; }
function tgDens(r){ return r.cont.peso / (r.cont.n * tgArea(r.cont)); }
function tgChiuso(r){ const t = tgState(r); return !!(r.cont.chiuso && t.chiuso); }
function tgPerPan(r){ const t = tgState(r); if (tgChiuso(r)) return tgArea(t) * (t.h > 0 ? t.h : r.cont.h) * r.cont.chiuso.gl / 1000; return tgArea(t) * tgDens(r) * (tgUsaH(r) ? t.h / r.cont.h : 1); }
function tgFactor(r){ const t = tgState(r); return t.n * tgPerPan(r) / r.cont.peso; }
function tgDim(t){ const h = t.h > 0 ? ` × h ${fmt(t.h)}` : ""; return t.forma === "tonda" ? `tondo Ø ${fmt(t.d)}${h} cm` : `${fmt(t.a)} × ${fmt(t.b)}${h} cm`; }
function tgText(r){ const t = tgState(r); return `${tgChiuso(r) ? "chiuso, " : ""}${fmt(t.n)} ${t.n === 1 ? r.cont.nome : (r.cont.nome === "teglia" ? "teglie" : "stampi")} ${tgDim(t)}, ${fmt(tgPerPan(r))} g di ${r.cont.label} ciascun${r.cont.nome === "teglia" ? "a" : "o"}`; }
function uLab(u, q){ return u === "spicchi" && fmt(q) === "1" ? "spicchio" : u; }
function groupTotal(g, f){ return g.ingredienti.reduce((s, i) => s + (i.qta && (i.u === "g" || i.u === "ml") ? i.qta * f : 0), 0); }

function renderRecipe(r){
  const f = state.factor[r.id] || 1;
  const porz = r.porzioni * f;
  const step = r.porzioniStep || (r.porzioni >= 4 ? 1 : 0.5);
  const dec = step < 1 ? 1 : 0;
  const quick = [0.5, 1, 1.5, 2, 3];

  let html = masthead("ricette") + `
  <a class="back" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Tutte le ricette</a>
  <div class="hero">
    <div class="art">${art(r)}</div>
    <div class="head">
      <span class="path">${pathOf(r)}</span>
      ${editTitle.id === r.id ? `<div class="title-edit"><input id="tnew" value="${esc(r.titolo)}" aria-label="Nuovo nome della ricetta"><button class="btn small" id="tsave">Salva</button><button class="btn ghost small" id="tcancel">Annulla</button>${r.titolo !== r.titoloOrig ? `<button class="btn ghost small" id="treset">Nome originale</button>` : ""}</div>`
        : `<h1>${esc(r.titolo)}${isOwner && titoliRef ? ` <button class="pencil" id="tedit" aria-label="Rinomina la ricetta" title="Rinomina"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg></button>` : ""}</h1>`}
      ${r.descrizione ? `<p>${esc(r.descrizione)}</p>` : ""}
      ${r.fonte ? `<p>Fonte: ${r.fonte.url ? `<a href="${esc(r.fonte.url)}" target="_blank" rel="noopener">${esc(r.fonte.nome)}</a>` : esc(r.fonte.nome)}</p>` : ""}
    </div>
  </div>

  <div class="recap" aria-label="Riepilogo">
    <div class="rc rc-time"><span class="lab">${ICON.clock}Tempo totale</span><span class="big">${durR(r)}</span>
      <ul class="fasi">${(r.fasi || []).filter(f => !f.prima).map(f => `<li class="${f.parallelo ? "par" : ""}"><span>${esc(V(f.nome))}${f.parallelo ? " (in contemporanea)" : ""}</span><b>${faseDur(f)}</b></li>`).join("")}</ul></div>
    <div class="rc"><span class="lab">${cookIcon(cot(r).tipo)}Cottura${cot(r).forno ? " nel tuo forno" : ""}</span><span class="big" style="font-size:18px">${esc(cot(r).dettaglio)}</span>
      ${cot(r).forno ? `<ul class="fasi forno-steps">${cot(r).forno.map(x => `<li><span>${esc(x.fase)}: ${esc(x.funzione)}${scatti(x.funzione)} ${esc(x.temp)}${x.ripiano ? `, ripiano ${esc(x.ripiano)}` : ""}</span><b>${esc(x.tempo)}</b></li>`).join("")}</ul>${cot(r).preriscaldo ? `<span class="sub">${esc(cot(r).preriscaldo)}</span>` : ""}<a class="sub" href="#elettrodomestici" data-goto="forno">Il tuo forno: funzioni, pregi e difetti</a>` : (cot(r).extra ? `<span class="sub">${esc(cot(r).extra)}</span>` : "")}</div>
    <div class="rc"><span class="lab">${ICON.tools}Strumenti</span><ul>${VL(r.strumenti).map(s => `<li>${esc(s)}</li>`).join("")}</ul>${usaPadelle(r) ? `<a class="sub pad" href="#impostazioni">Ricetta scritta per padelle ${acciaio() ? "in acciaio" : "antiaderenti"} (cambia in Impostazioni)</a>` : ""}</div>
    <div class="rc"><span class="lab">${ICON.basket}Ingredienti</span><span class="big">${ingCount(r)}</span>
      <span class="sub">${esc(allIng(r).filter(i => !/^Sale /.test(i.nome)).map(i => i.nome.split(/[,(]/)[0].trim()).filter((v, i, a) => a.indexOf(v) === i).join(", "))}</span></div>
    ${r.energia && mostraConsumi() ? (() => { const [a, b] = energiaMain(r); const alt = r.energia.filter(x => x.alt && (x.app !== "ninja" || showNinja())); const main = r.energia.filter(x => !x.alt); return `<div class="rc"><span class="lab">${ICON.bolt}Consumo stimato</span><span class="big">${costoTxt(a, b)}</span>
      <span class="sub">${main.map(x => `${kwhTxt(x.kwh[0], x.kwh[1])} kWh${x.app === "altro" ? "" : " con il " + appNome(x.app)}: ${esc(V(x.come))}`).join("; ")}</span>
      ${alt.map(x => `<span class="sub">Nel ${appNome(x.app)}: ${kwhTxt(x.kwh[0], x.kwh[1])} kWh, ${costoTxt(x.kwh[0], x.kwh[1])}</span>`).join("")}
      <a class="sub" href="#impostazioni">Prezzo usato: ${prezzo().toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 3 })} €/kWh (cambialo)</a></div>`; })() : ""}
  </div>

  ${showPiastra(r) ? `<details class="induzione"><summary><span class="ninja-chip ind-chip">Induzione</span> Sul tuo piano a induzione</summary>
    <ul class="fasi" style="columns:1">${VL(r.piastra.passi).map(p => `<li><span>${esc(p.fase)}</span><b>${/^\d/.test(p.livello) ? "livello " : ""}${esc(p.livello)} · ${esc(p.tempo)}</b></li>`).join("")}</ul>
    ${r.piastra.zona ? `<p class="tip">Zona: ${esc(r.piastra.zona)}</p>` : ""}
    <p style="margin:10px 0 0"><b>Attenzioni</b></p><ul>${VL(r.piastra.attenzioni).map(a => `<li>${esc(a)}</li>`).join("")}</ul>
    <div class="diff"><b>Rispetto a un fornello normale</b><br>${esc(V(r.piastra.differenza))}</div>
    <a class="tip" href="#elettrodomestici" data-goto="piastra">Il tuo piano a induzione: livelli, pregi e difetti</a></details>` : ""}
  ${r.ninja && showNinja() ? (r.ninja.ok ? `<details class="ninja ok"><summary><span class="ninja-chip">Ninja</span> Si può fare nel Ninja Foodi SP101EU</summary>
    <div class="ninja-grid"><div><span class="lab">Funzione</span><b>${esc(r.ninja.funzione)}</b></div><div><span class="lab">Temperatura</span><b>${esc(r.ninja.temp)}</b></div><div><span class="lab">Tempo</span><b>${esc(r.ninja.tempo)}</b></div></div>
    <p><span class="lab">Contenitore</span> ${esc(r.ninja.contenitore)}</p>
    <ol>${r.ninja.passi.map(p => `<li>${esc(p)}</li>`).join("")}</ol>
    <p class="tip">Tempi e temperature adattati dal forno di casa con le indicazioni del manuale Ninja (circa 10 °C e 30% di tempo in meno): la prima volta controlla la cottura. <a href="#elettrodomestici" data-goto="ninja">Scheda del Ninja</a></p></details>`
    : `<div class="ninja no"><span class="ninja-chip off">Ninja</span> <b>Non adatta al Ninja Foodi SP101EU.</b> ${esc(r.ninja.motivo)}</div>`) : ""}
  ${cestino.has(r.id) ? `<div class="warn"><b>Questa ricetta è stata eliminata.</b> ${isOwner ? `<button class="btn ghost small" id="restore1">Ripristina</button>` : ""}</div>` : ""}
  ${r.verificare && r.verificare.length ? `<div class="warn"><b>Da verificare</b><ul>${r.verificare.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>` : ""}

  <div class="recipe-body">
    <div class="panel ing">
      <h2 style="font-size:20px;margin-bottom:10px">Ingredienti</h2>
      <div class="scaler">
        ${r.cont ? (() => { const t = tgState(r); const per = tgPerPan(r); const match = Math.abs(tgFactor(r) - f) < 1e-6; const C1 = r.cont.nome === "teglia" ? "Teglia" : "Stampo";
          const formula = r.cont.formula ? (t.forma === "rett" ? "lato × lato ÷ 2" : "raggio × raggio × 3,14 ÷ 2") : tgChiuso(r) ? `${r.cont.chiuso.gl} g per litro di stampo chiuso` : r.cont.nome === "stampo" && r.cont.h ? `${fmt(Math.round(r.cont.peso / (r.cont.n * tgArea(r.cont) * r.cont.h) * 1000))} g per litro di stampo` : `${fmt(Math.round(tgDens(r) * 100) / 100)} g per cm² di fondo`;
          return `
        <div class="teglia">
          <div class="scaler-row"><span>${C1}</span>
            <div class="seg" role="group" aria-label="Forma">
              <button data-forma="rett" aria-pressed="${t.forma === "rett"}">Rettangolare</button>
              <button data-forma="tonda" aria-pressed="${t.forma === "tonda"}">Tondo</button>
            </div>
          </div>
          ${r.cont.chiuso ? `<div class="scaler-row"><span>Coperchio</span><div class="seg" role="group" aria-label="Coperchio"><button data-chiuso="0" aria-pressed="${!t.chiuso}">Aperto</button><button data-chiuso="1" aria-pressed="${!!t.chiuso}">Chiuso</button></div></div>` : ""}
          <div class="scaler-row">
            ${t.forma === "rett" ? `<span class="qty"><input id="tg-a" inputmode="decimal" value="${fmt(t.a)}" aria-label="Primo lato in cm"></span><span>×</span><span class="qty"><input id="tg-b" inputmode="decimal" value="${fmt(t.b)}" aria-label="Secondo lato in cm"><span class="u">cm</span></span>`
              : `<span>Ø</span><span class="qty"><input id="tg-d" inputmode="decimal" value="${fmt(t.d)}" aria-label="Diametro in cm"><span class="u">cm</span></span>`}
            ${r.cont.nome === "stampo" ? `<span>h</span><span class="qty"><input id="tg-h" inputmode="decimal" value="${fmt(t.h)}" aria-label="Altezza in cm, 0 per non considerarla"><span class="u">cm</span></span>` : ""}
            <span style="margin-left:6px">quanti?</span><span class="qty"><input id="tg-n" inputmode="numeric" value="${fmt(t.n)}" aria-label="Quanti" style="width:44px"></span>
          </div>
          <span class="factor">${match ? `${r.cont.label[0].toUpperCase() + r.cont.label.slice(1)} per ${r.cont.nome}: <b>${fmt(per)} g</b> (${formula})` : `Dosi cambiate a mano. <a href="#" id="tg-apply">Ricalcola per ${r.cont.nome === "teglia" ? "la teglia" : "lo stampo"}</a>`}</span>
          ${r.cont.nome === "stampo" && r.cont.h ? `<span class="tip">Regola di riempimento: ${esc(tgChiuso(r) ? r.cont.chiuso.regola : r.cont.regola)}. Altezza facoltativa: con 0 si usa quella standard di ${fmt(r.cont.h)} cm.</span>` : ""}
          ${tgChiuso(r) ? `<span class="tip chiuso-tip">${esc(r.cont.chiuso.nota)}</span>` : ""}
        </div>`; })() : ""}
        <div class="scaler-row" ${r.cont ? "hidden" : ""}>
          <span>Dosi per</span>
          <div class="stepper">
            <button id="minus" aria-label="Meno">−</button>
            <input id="porz" type="text" inputmode="decimal" value="${fmt(porz)}" aria-label="Dosi per">
            <button id="plus" aria-label="Più">+</button>
          </div>
          <span>${porzLabel(r, porz)}</span>
        </div>
        <div class="quick" role="group" aria-label="Moltiplica la ricetta">
          ${quick.map(x => `<button data-x="${x}" aria-pressed="${Math.abs(f - x) < 1e-9}">×${fmt(x)}</button>`).join("")}
        </div>
        <span class="factor">${Math.abs(f - 1) < 1e-9 ? "Dosi originali" : `Dosi moltiplicate per <b>${fmt(Math.round(f * 100) / 100)}</b> rispetto all'originale`}</span>
        <p class="tip">Puoi anche scrivere la quantità di un ingrediente (o il peso totale): tutto il resto si ricalcola in proporzione.</p>
      </div>
      ${r.gruppi.map((g, gi) => `<div class="group">${r.gruppi.length > 1 ? `<h3>${esc(g.nome)}</h3>` : ""}
        <ul class="ing-list">${g.ingredienti.map((i, ii) => `
          <li>
            ${i.qta == null ? `<span class="qb">q.b.</span>` :
              `<span class="qty"><input type="text" inputmode="decimal" id="q-${gi}-${ii}" data-base="${i.qta}" value="${fmt(i.qta * f)}" aria-label="Quantità di ${esc(i.nome)}"><span class="u">${esc(uLab(i.u, i.qta * f))}</span></span>`}
            <span class="ing-name">${esc(i.nome)}${i.nota ? `<small>${esc(i.nota)}</small>` : ""}</span>
          </li>`).join("")}
        </ul>${g.totale ? `<div class="total">Peso totale ${esc(g.nome.toLowerCase())}: <span class="qty"><input type="text" inputmode="decimal" id="tot-${gi}" data-base="${groupTotal(g, 1)}" value="${fmt(groupTotal(g, f))}" aria-label="Peso totale ${esc(g.nome)}"><span class="u">g</span></span></div>` : ""}</div>`).join("")}
    </div>
    <div>
      <div class="panel">
        <h2 style="font-size:20px;margin-bottom:14px">Procedimento</h2>
        <ol class="steps">${VL(r.procedimento).map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
        ${r.note && r.note.length ? `<div class="notes"><h3>Note</h3><ul>${r.note.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
      </div>
      <div class="actions">
        <button class="btn" id="pdf" ${downloads ? "" : "disabled"}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
          Scarica PDF
        </button>
        ${Math.abs(f - 1) > 1e-9 ? `<button class="btn ghost" id="reset">Torna alle dosi originali</button>` : ""}
        <button class="btn danger" id="delr" ${cestinoRef && isOwner ? "" : "hidden"}>${state.confirmDel === r.id ? "Tocca di nuovo per eliminare" : "Elimina ricetta"}</button>
        <span class="status" id="status">${downloads ? "" : "Il download non è disponibile in questa vista."}</span>
      </div>
    </div>
  </div>`;
  app.innerHTML = html;

  const setF = nf => { if (nf > 0){ state.factor[r.id] = nf; renderRecipe(r); } };
  if (r.cont){
    const t = tgState(r);
    const applyT = () => setF(tgFactor(r));
    app.querySelectorAll("[data-forma]").forEach(b => b.onclick = () => { t.forma = b.dataset.forma; applyT(); });
    app.querySelectorAll("[data-chiuso]").forEach(b => b.onclick = () => { t.chiuso = b.dataset.chiuso === "1"; applyT(); });
    [["tg-a","a"],["tg-b","b"],["tg-d","d"],["tg-n","n"],["tg-h","h"]].forEach(([id, key]) => {
      const el = document.getElementById(id); if (!el) return;
      el.addEventListener("change", () => { const raw = String(el.value).trim(); const v = parseNum(raw); if (key === "h" && (raw === "0" || raw === "")) t.h = 0; else if (v != null) t[key] = key === "n" ? Math.max(1, Math.round(v)) : v; applyT(); });
      el.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); el.blur(); } });
      el.addEventListener("focus", () => el.select());
    });
    const ap = document.getElementById("tg-apply"); if (ap) ap.onclick = e => { e.preventDefault(); applyT(); };
  }
  const te = document.getElementById("tedit"); if (te) te.onclick = () => { editTitle.id = r.id; renderRecipe(r); const i = document.getElementById("tnew"); i.focus(); i.select(); };
  const saveTitle = v => { const map = {}; RICETTE.forEach(x => { if (x.titolo !== x.titoloOrig) map[x.id] = x.titolo; }); if (v != null){ if (v && v !== r.titoloOrig) map[r.id] = v; else delete map[r.id]; r.titolo = v || r.titoloOrig; } editTitle.id = null; store.writing = store.writing.then(() => titoliRef.set({ t: map })).catch(() => {}); renderRecipe(r); };
  const ts = document.getElementById("tsave"); if (ts){ const inp = document.getElementById("tnew"); ts.onclick = () => saveTitle(inp.value.trim()); inp.addEventListener("keydown", e => { if (e.key === "Enter") saveTitle(inp.value.trim()); if (e.key === "Escape"){ editTitle.id = null; renderRecipe(r); } }); }
  const tc = document.getElementById("tcancel"); if (tc) tc.onclick = () => { editTitle.id = null; renderRecipe(r); };
  const tr0 = document.getElementById("treset"); if (tr0) tr0.onclick = () => saveTitle("");
  const rs1 = document.getElementById("restore1"); if (rs1) rs1.onclick = () => { cestino.delete(r.id); saveCestino(); renderRecipe(r); };
  const pz = document.getElementById("porz");
  const applyP = () => { const v = parseNum(pz.value); if (v == null){ pz.value = fmt(porz); return; } setF(v / r.porzioni); };
  pz.addEventListener("change", applyP);
  pz.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); pz.blur(); } });
  pz.addEventListener("focus", () => pz.select());
  document.getElementById("minus").onclick = () => { const p = Math.max(step, Math.round((porz - step) / step) * step); setF(p / r.porzioni); };
  document.getElementById("plus").onclick = () => { const p = Math.round((porz + step) / step) * step; setF(p / r.porzioni); };
  app.querySelectorAll("[data-x]").forEach(b => b.onclick = () => setF(parseFloat(b.dataset.x)));
  const reset = document.getElementById("reset"); if (reset) reset.onclick = () => setF(1);
  app.querySelectorAll(".qty input").forEach(inp => {
    const base = parseFloat(inp.dataset.base);
    const apply = () => {
      const v = parseNum(inp.value);
      if (v == null){ inp.value = fmt(base * f); return; }
      setF(v / base);
    };
    inp.addEventListener("change", apply);
    inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); inp.blur(); } });
    inp.addEventListener("focus", () => inp.select());
  });
  document.getElementById("pdf").onclick = () => conDotazione(() => saveRecipePdf(r, f));
  document.getElementById("delr").onclick = () => {
    if (state.confirmDel !== r.id){ state.confirmDel = r.id; renderRecipe(r); return; }
    state.confirmDel = null; cestino.add(r.id); saveCestino(); location.hash = "";
  };
}

/* ---------- PDF ---------- */
function pdfText(s){ return String(s).replace(/[–—]/g, "-").replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/×/g, "x").replace(/→/g, "->").replace(/·/g, "-"); }
function newPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const P = { doc, M: 18, CW: 174, y: 20 };
  P.need = h => { if (P.y + h > 280){ doc.addPage(); P.y = 20; } };
  P.para = (txt, size, style, color, indent = 0, lh = 1.4) => {
    doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...color);
    for (const l of doc.splitTextToSize(pdfText(txt), P.CW - indent)){ P.need(size * 0.36 * lh); doc.text(l, P.M + indent, P.y); P.y += size * 0.36 * lh; }
  };
  P.footer = () => {
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++){ doc.setPage(i); doc.setFont("helvetica", "italic"); doc.setFontSize(8); doc.setTextColor(140, 150, 145); doc.text("De (Nova) Mensa Populari", P.M, 290); doc.text(`${i}/${n}`, 192, 290, { align: "right" }); }
  };
  return P;
}
const C = { green: [47,107,79], ink: [29,38,34], grey: [93,107,100], red: [184,67,46] };

function writeRecipe(P, r, f){
  const { doc } = P;
  P.para(pdfText(`${r.sezione}${r.sottosezione ? " - " + r.sottosezione : ""}`).toUpperCase(), 9, "bold", C.green);
  P.y += 1; P.para(r.titolo, 20, "bold", C.ink, 0, 1.25); P.y += 1;
  if (r.descrizione) P.para(r.descrizione, 10, "normal", C.grey);
  if (r.fonte) P.para(`Fonte: ${r.fonte.nome}${r.fonte.url ? " - " + r.fonte.url : ""}`, 9, "italic", C.grey);
  P.y += 2;
  const porz = r.porzioni * f;
  if (r.cont && Math.abs(tgFactor(r) - f) < 1e-6) P.para(`${r.cont.nome === "teglia" ? "Teglia" : "Stampo"}: ${tgText(r)}`, 10, "bold", C.green);
  else P.para(`Dosi per ${fmt(porz)} ${porzLabel(r, porz)}${Math.abs(f - 1) > 1e-9 ? ` (ricetta originale x ${fmt(Math.round(f * 100) / 100)})` : ""}`, 10, "bold", C.green);
  P.y += 2;
  P.para(`Tempo totale: ${durR(r)}`, 10, "bold", C.ink);
  (r.fasi || []).filter(fz => !fz.prima).forEach(fz => P.para(`- ${V(fz.nome)}${fz.parallelo ? " (in contemporanea)" : ""}: ${faseDur(fz)}`, 9, "normal", C.grey, 3));
  P.para(`Cottura: ${cot(r).dettaglio}${!cot(r).forno && cot(r).extra ? " - " + cot(r).extra : ""}`, 10, "normal", C.ink);
  if (cot(r).forno){ cot(r).forno.forEach(x => P.para(`- ${x.fase}: ${x.funzione}${scatti(x.funzione)} ${x.temp}${x.ripiano ? ", ripiano " + x.ripiano : ""}, ${x.tempo}`, 9, "normal", C.grey, 3)); if (cot(r).preriscaldo) P.para(`- ${cot(r).preriscaldo}`, 9, "normal", C.grey, 3); }
  P.para(`Strumenti: ${VL(r.strumenti).join(", ")}`, 10, "normal", C.ink);
  if (r.energia && mostraConsumi()){ const [a, b] = energiaMain(r); P.para(`Consumo stimato: ${kwhTxt(a, b)} kWh, ${costoTxt(a, b)} (a ${prezzo().toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 3 })} €/kWh)${r.energia.filter(x => x.alt && (x.app !== "ninja" || showNinja())).map(x => `; nel ${appNome(x.app)} ${kwhTxt(x.kwh[0], x.kwh[1])} kWh, ${costoTxt(x.kwh[0], x.kwh[1])}`).join("")}`, 10, "normal", C.ink); }
  P.y += 3;
  if (r.verificare && r.verificare.length){ P.para("Da verificare", 11, "bold", C.red); r.verificare.forEach(v => P.para("- " + v, 9, "normal", C.red, 2)); P.y += 3; }

  P.para("Ingredienti", 14, "bold", C.ink); P.y += 1;
  for (const g of r.gruppi){
    if (r.gruppi.length > 1){ P.y += 1; P.para(g.nome.toUpperCase(), 9, "bold", C.grey); }
    for (const i of g.ingredienti){
      P.need(6);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...C.ink);
      doc.text(pdfText(i.qta == null ? "q.b." : `${fmt(i.qta * f)} ${uLab(i.u, i.qta * f)}`), P.M + 26, P.y, { align: "right" });
      doc.setFont("helvetica", "normal");
      const lines = doc.splitTextToSize(pdfText(i.nome + (i.nota ? ` (${i.nota})` : "")), P.CW - 32);
      lines.forEach((l, k) => { if (k){ P.y += 5; P.need(5); } doc.text(l, P.M + 32, P.y); });
      P.y += 6;
    }
    if (g.totale) P.para(`Peso totale ${g.nome.toLowerCase()}: ${fmt(groupTotal(g, f))} g`, 9, "italic", C.grey, 32);
  }
  P.y += 4;
  P.para("Procedimento", 14, "bold", C.ink); P.y += 1;
  VL(r.procedimento).forEach((s, k) => {
    P.need(6);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...C.green);
    doc.text(`${k + 1}.`, P.M, P.y);
    P.para(s, 11, "normal", C.ink, 8); P.y += 2;
  });
  if (showPiastra(r)){ P.y += 3; P.para("Sul tuo piano a induzione", 14, "bold", C.ink); P.y += 1;
    VL(r.piastra.passi).forEach(p => P.para(`- ${p.fase}: ${/^\d/.test(p.livello) ? "livello " : ""}${p.livello}, ${p.tempo}`, 10, "normal", C.ink, 2));
    if (r.piastra.zona) P.para(`Zona: ${r.piastra.zona}`, 9, "italic", C.grey, 2);
    P.y += 1; P.para("Attenzioni", 11, "bold", C.ink); VL(r.piastra.attenzioni).forEach(a => P.para(`- ${a}`, 10, "normal", C.ink, 2));
    P.y += 1; P.para("Rispetto a un fornello normale", 11, "bold", C.red); P.para(V(r.piastra.differenza), 10, "normal", C.red, 2); }
  if (r.ninja && showNinja()){ P.y += 3; if (r.ninja.ok){ P.para("Nel Ninja Foodi SP101EU", 14, "bold", C.ink); P.y += 1; P.para(`Funzione ${r.ninja.funzione} - ${r.ninja.temp} - ${r.ninja.tempo}`, 10, "bold", C.green); P.para(r.ninja.contenitore, 10, "normal", C.ink); r.ninja.passi.forEach((p, k) => P.para(`${k + 1}. ${p}`, 10, "normal", C.ink, 2)); } else { P.para(`Ninja Foodi SP101EU: non adatta. ${r.ninja.motivo}`, 9, "italic", C.grey); } }
  if (r.note && r.note.length){ P.y += 2; P.para("Note", 14, "bold", C.ink); P.y += 1; r.note.forEach(n => { P.para("- " + n, 10, "normal", C.grey, 2); P.y += 1; }); }
}

async function offer(doc, name, status){
  if (status) status.textContent = "";
  try {
    await downloads.save({ filename: name.replace(/[^\p{L}\p{N} ]/gu, "").trim().replace(/\s+/g, " ") + ".pdf", data: doc.output("blob") });
    if (status) status.textContent = "PDF salvato.";
  } catch (e){
    if (status) status.textContent = e && e.code === "declined" ? "" : "Il PDF non è stato salvato. Riprova.";
  }
}
function chiediDotazione(){
  return new Promise(res => {
    const d = document.createElement("div"); d.className = "dot-modal";
    d.innerHTML = `<div class="dot-box" role="dialog" aria-modal="true" aria-labelledby="dot-t">
      <h2 id="dot-t">Per quale cucina?</h2>
      <p>Le ricette nel PDF devono essere scritte per la dotazione di Casa di Federico oppure per una cucina qualsiasi?</p>
      <button class="btn" data-v="casa"><b>Casa di Federico</b><small>forno IKEA con gli scatti e i ripiani, piano a induzione con i livelli, Ninja Foodi e schede degli elettrodomestici</small></button>
      <button class="btn ghost" data-v="gen"><b>Cucina generica</b><small>forno, fuochi e tempi generici, senza Ninja e senza schede degli elettrodomestici</small></button>
      <button class="link" data-v="">Annulla</button></div>`;
    document.body.appendChild(d);
    const done = v => { d.remove(); document.removeEventListener("keydown", esc1); res(v || null); };
    const esc1 = e => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", esc1);
    d.addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) done(b.dataset.v); else if (e.target === d) done(null); });
    d.querySelector("[data-v=casa]").focus();
  });
}
async function conDotazione(fn){ const v = await chiediDotazione(); if (!v) return; DOT = v; try { fn(v); } finally { DOT = null; } }
function saveRecipePdf(r, f){
  const status = document.getElementById("status");
  if (!downloads || !window.jspdf){ status.textContent = "Il PDF non si può creare in questa vista."; return; }
  const P = newPdf(); writeRecipe(P, r, f); P.footer();
  offer(P.doc, r.titolo, status);
}

const PREZZO_DEF = 0.35;
function prezzo(){ return state.prezzo || PREZZO_DEF; }

function appNome(a){ return a === "piastra" && !induzioneCasa() ? "fornello elettrico" : APP_NOME[a]; }
function eur(x){ return x.toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €"; }
function kwhTxt(a, b){ const f = v => v.toLocaleString("it-IT", { maximumFractionDigits: 2 }); return a === b ? f(a) : `${f(a)}–${f(b)}`; }
function energiaMain(r){ const e = (r.energia || []).filter(x => !x.alt); return [e.reduce((s, x) => s + x.kwh[0], 0), e.reduce((s, x) => s + x.kwh[1], 0)]; }
function costoTxt(a, b){ const p = prezzo(); return a * p < 0.01 ? "meno di 1 cent" : (Math.abs(a - b) < 1e-9 ? eur(a * p) : `${eur(a * p).replace(" €", "")}–${eur(b * p)}`); }
function savePrezzo(v){
  state.prezzo = v;

}

function writeScheda(P, E){
  P.para(E.path.toUpperCase(), 9, "bold", C.green); P.y += 1;
  P.para(E.nome, 20, "bold", C.ink, 0, 1.25); P.y += 1;
  P.para(E.intro, 10, "normal", C.grey); P.y += 3;
  E.dati.forEach(([l, v, sub]) => P.para(`${l}: ${v}${sub ? " (" + sub + ")" : ""}`, 10, "normal", C.ink));
  if (E.id === "forno"){ P.y += 3; P.para("La manopola delle funzioni (scatti da 0, senso orario)", 14, "bold", C.ink); P.y += 1; E.funzioni.forEach(([k, n, en, d, t]) => P.para(`${k} scatt${k === 1 ? "o" : "i"} - ${n} (${en}): ${d}${t ? " (" + t + ")" : ""}`, 10, "normal", C.ink, 2)); }
  listeOf(E).forEach(L => { P.y += 3; P.para(L.titolo, 14, "bold", C.ink); P.y += 1; if (L.nota) P.para(L.nota, 9, "italic", C.grey); L.righe.forEach(([a, b]) => P.para(`- ${a}: ${b}`, 10, "normal", C.ink, 2)); });
  P.y += 3; P.para("Pregi", 14, "bold", C.ink); P.y += 1; E.pregi.forEach(([a, b]) => P.para(`- ${a}: ${b}`, 10, "normal", C.ink, 2));
  P.y += 3; P.para("Difetti e attenzioni", 14, "bold", C.ink); P.y += 1; E.difetti.forEach(([a, b]) => P.para(`- ${a}: ${b}`, 10, "normal", C.ink, 2));
  P.y += 2; P.para(E.nota, 9, "italic", C.grey);
}

function writeMenu(P, m){
  const rs = menuRecipes(m), shop = shoppingList(m);
  P.para(`MENÙ · ${dataIt(m.creato)}`.toUpperCase(), 9, "bold", C.green); P.y += 1; P.para(m.nome, 20, "bold", C.ink, 0, 1.25); P.y += 3;
  for (const s of SEZIONI){
    const items = rs.filter(r => r.sezione === s); if (!items.length) continue;
    P.para(s.toUpperCase(), 10, "bold", C.green);
    items.forEach(r => P.para(`${r.titolo}  -  ${durR(r)}, ${cot(r).dettaglio}`, 11, "normal", C.ink, 3));
    P.y += 2;
  }
  if (mostraConsumi()){ const a = rs.reduce((s, r) => s + energiaMain(r)[0], 0), b = rs.reduce((s, r) => s + energiaMain(r)[1], 0); if (b > 0) P.para(`Energia stimata: ${kwhTxt(a, b)} kWh, ${costoTxt(a, b)}`, 10, "normal", C.ink); }
  if ((m.frigo || []).length){ P.y += 1; P.para(`In frigo: ${m.frigo.join(", ")}`, 9, "italic", C.grey); }
  if (shop.length){ P.y += 2; P.para("Lista della spesa", 14, "bold", C.ink); P.y += 1; shop.forEach(x => P.para(`[ ]  ${x.nome}  (${[...x.per].join(", ")})`, 10, "normal", C.ink, 2)); }
}

/* ---------- Scarica il ricettario (intero o in parte) ---------- */
function sel(){ if (!state.sel) state.sel = { ricette: new Set(VIS().map(r => r.id)), menu: new Set(store.menus.map(m => m.id)), app: new Set(ELETTRO().map(E => E.id)) }; return state.sel; }
function triState(ids, set){ const n = ids.filter(id => set.has(id)).length; return n === 0 ? "none" : n === ids.length ? "all" : "some"; }

function renderScarica(){
  const S = sel();
  const allIds = VIS().map(r => r.id);
  const cb = (key, label, st, extra = "") => `<label class="ck ${extra}"><input type="checkbox" data-ck="${esc(key)}" ${st === "all" ? "checked" : ""} ${st === "some" ? 'data-ind="1"' : ""}><span>${label}</span></label>`;
  let html = masthead("scarica") + `<h1 style="margin-bottom:6px">Scarica in PDF</h1>
  <p class="status" style="max-width:68ch;margin:0 0 14px">Scegli cosa mettere nel PDF: tutto il ricettario, intere sezioni, singole ricette, i menù e le schede degli elettrodomestici. Il file si apre con la copertina e un indice con i numeri di pagina. Le ricette sono con le dosi originali; prima di creare il PDF ti chiedo se scriverle per la dotazione di Casa di Federico o per una cucina generica.</p>
  <div class="panel tree">
    ${cb("tutto", "<b>Tutto il ricettario</b>", (() => { const a = triState(allIds, S.ricette), b = triState(store.menus.map(m => m.id), S.menu); const vals = [a, store.menus.length ? b : null, triState(ELETTRO().map(E => E.id), S.app)].filter(Boolean); return vals.every(v => v === "all") ? "all" : vals.every(v => v === "none") ? "none" : "some"; })())}
    <div class="tree-group"><h3>Ricette</h3>`;
  for (const sez of SEZIONI){
    const rs = VIS().filter(r => r.sezione === sez); if (!rs.length) continue;
    html += `<div class="tree-sez">${cb("sez:" + sez, `<b>${sez}</b> <span class="n">${rs.length}</span>`, triState(rs.map(r => r.id), S.ricette))}`;
    const subs = [...new Set(rs.map(r => r.sottosezione || ""))].sort((a, b) => a.localeCompare(b, "it"));
    for (const sub of subs){
      const rr = rs.filter(r => (r.sottosezione || "") === sub).sort((a, b) => a.titolo.localeCompare(b.titolo, "it"));
      html += `<div class="tree-sub">${sub ? cb("sub:" + sez + "|" + sub, esc(sub), triState(rr.map(r => r.id), S.ricette)) : ""}
        <div class="tree-items">${rr.map(r => cb("r:" + r.id, esc(r.titolo), S.ricette.has(r.id) ? "all" : "none")).join("")}</div></div>`;
    }
    html += `</div>`;
  }
  html += `</div><div class="tree-group"><h3>Menù</h3>${store.menus.length ? cb("menu:all", "<b>Tutti i menù</b>", triState(store.menus.map(m => m.id), S.menu)) + `<div class="tree-items">${store.menus.map(m => cb("m:" + m.id, esc(m.nome), S.menu.has(m.id) ? "all" : "none")).join("")}</div>` : `<p class="empty">Non hai ancora menù salvati.</p>`}</div>
    <div class="tree-group"><h3>Elettrodomestici in dotazione</h3>${cb("app:all", "<b>Tutti gli elettrodomestici</b>", triState(ELETTRO().map(E => E.id), S.app))}<div class="tree-items">${ELETTRO().map(E => cb("a:" + E.id, esc(E.nome), S.app.has(E.id) ? "all" : "none")).join("")}</div></div>
  </div>
  <div class="sticky-bar">
    <button class="btn" id="mkpdf" ${downloads ? "" : "disabled"}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Crea PDF</button>
    <span class="status" id="status">${S.ricette.size} ricette · ${S.menu.size} menù · ${S.app.size} elettrodomestic${S.app.size === 1 ? "o" : "i"}${downloads ? "" : " · Il download non è disponibile in questa vista."}</span>
  </div>`;
  app.innerHTML = html;
  app.querySelectorAll("[data-ind]").forEach(i => i.indeterminate = true);
  app.querySelectorAll("[data-ck]").forEach(i => i.addEventListener("change", () => {
    const k = i.dataset.ck, on = i.checked;
    const setAll = (set, ids) => ids.forEach(id => on ? set.add(id) : set.delete(id));
    if (k === "tutto"){ setAll(S.ricette, allIds); setAll(S.menu, store.menus.map(m => m.id)); setAll(S.app, ELETTRO().map(E => E.id)); }
    else if (k.startsWith("sez:")) setAll(S.ricette, VIS().filter(r => r.sezione === k.slice(4)).map(r => r.id));
    else if (k.startsWith("sub:")){ const [sz, sb] = k.slice(4).split("|"); setAll(S.ricette, VIS().filter(r => r.sezione === sz && (r.sottosezione || "") === sb).map(r => r.id)); }
    else if (k.startsWith("r:")) setAll(S.ricette, [k.slice(2)]);
    else if (k === "menu:all") setAll(S.menu, store.menus.map(m => m.id));
    else if (k.startsWith("m:")) setAll(S.menu, [k.slice(2)]);
    else if (k === "app:all") setAll(S.app, ELETTRO().map(E => E.id));
    else if (k.startsWith("a:")) setAll(S.app, [k.slice(2)]);
    const y = window.scrollY; renderScarica(); window.scrollTo(0, y);
  }));
  document.getElementById("mkpdf").onclick = () => conDotazione(v => buildBookPdf(S, v));
}

function buildBookPdf(S, v){
  const status = document.getElementById("status");
  if (!downloads || !window.jspdf){ status.textContent = "Il PDF non si può creare in questa vista."; return; }
  const recipes = SEZIONI.flatMap(sez => VIS().filter(r => r.sezione === sez && S.ricette.has(r.id)).sort((a, b) => (a.sottosezione || "").localeCompare(b.sottosezione || "", "it") || a.titolo.localeCompare(b.titolo, "it")));
  const menus = store.menus.filter(m => S.menu.has(m.id)).sort((a, b) => a.creato - b.creato);
  if (!recipes.length && !menus.length && !S.app.size){ status.textContent = "Scegli almeno una cosa da mettere nel PDF."; return; }
  const apps0 = v === "gen" ? [] : ELETTRO().filter(E => S.app.has(E.id));
  const P = newPdf(), doc = P.doc;
  // copertina
  doc.setFillColor(47, 107, 79); doc.rect(0, 0, 210, 297, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(34);
  doc.text("De (Nova) Mensa", 20, 120); doc.text("Populari", 20, 136);
  doc.setFont("helvetica", "normal"); doc.setFontSize(12);
  const parti = [recipes.length ? `${recipes.length} ${recipes.length === 1 ? "ricetta" : "ricette"}` : "", menus.length ? `${menus.length} ${menus.length === 1 ? "menù" : "menù"}` : "", apps0.length ? (apps0.length === 1 ? "1 elettrodomestico" : `${apps0.length} elettrodomestici`) : "", v === "gen" ? "per una cucina generica" : "per la cucina di Casa di Federico"].filter(Boolean).join(" · ");
  doc.text(pdfText(parti), 20, 150);
  doc.text(new Date().toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }), 20, 158);
  // righe dell'indice
  const entries = [];
  let lastSez = null, lastSub = null;
  recipes.forEach(r => {
    if (r.sezione !== lastSez){ entries.push({ lvl: 0, label: r.sezione, key: "sez:" + r.sezione }); lastSez = r.sezione; lastSub = null; }
    if ((r.sottosezione || "") !== lastSub){ if (r.sottosezione) entries.push({ lvl: 1, label: r.sottosezione, key: "sub:" + r.sezione + "|" + r.sottosezione }); lastSub = r.sottosezione || ""; }
    entries.push({ lvl: 2, label: r.titolo, key: "r:" + r.id });
  });
  if (menus.length){ entries.push({ lvl: 0, label: "Menù", key: "menus" }); menus.forEach(m => entries.push({ lvl: 2, label: m.nome, key: "m:" + m.id })); }
  const apps = v === "gen" ? [] : ELETTRO().filter(E => S.app.has(E.id));
  if (apps.length){ entries.push({ lvl: 0, label: "Elettrodomestici in dotazione", key: "apps" }); apps.forEach(E => entries.push({ lvl: 2, label: E.nome, key: "a:" + E.id })); }
  const PER = 34, idxPages = Math.max(1, Math.ceil((entries.length + 2) / PER));
  for (let i = 0; i < idxPages; i++) doc.addPage();
  const page = {};
  const mark = k => { if (!(k in page)) page[k] = doc.getNumberOfPages(); };
  // contenuto
  lastSez = null; lastSub = null;
  recipes.forEach(r => {
    doc.addPage(); P.y = 20;
    if (r.sezione !== lastSez){ mark("sez:" + r.sezione); lastSez = r.sezione; lastSub = null; }
    if ((r.sottosezione || "") !== lastSub){ if (r.sottosezione) mark("sub:" + r.sezione + "|" + r.sottosezione); lastSub = r.sottosezione || ""; }
    mark("r:" + r.id);
    writeRecipe(P, r, 1);
  });
  menus.forEach((m, k) => { doc.addPage(); P.y = 20; if (!k) mark("menus"); mark("m:" + m.id); writeMenu(P, m); });
  apps.forEach((E, k) => { doc.addPage(); P.y = 20; if (!k) mark("apps"); mark("a:" + E.id); writeScheda(P, E); });
  // indice
  let ip = 2, y = 26;
  doc.setPage(ip); doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(...C.ink); doc.text("Indice", 18, y); y += 12;
  entries.forEach(e => {
    if (y > 280){ ip++; doc.setPage(ip); y = 24; }
    const x = 18 + e.lvl * 6, pg = page[e.key];
    doc.setFont("helvetica", e.lvl === 0 ? "bold" : e.lvl === 1 ? "italic" : "normal");
    doc.setFontSize(e.lvl === 0 ? 13 : 11);
    doc.setTextColor(...(e.lvl === 0 ? C.green : e.lvl === 1 ? C.grey : C.ink));
    if (e.lvl === 0 && y > 40) y += 2;
    const label = doc.splitTextToSize(pdfText(e.label), 150 - e.lvl * 6)[0];
    doc.text(label, x, y);
    if (pg){
      doc.text(String(pg), 192, y, { align: "right" });
      const w = doc.getTextWidth(label);
      doc.setDrawColor(200, 206, 202); doc.setLineDashPattern([0.5, 1], 0); doc.line(x + w + 2, y, 186, y); doc.setLineDashPattern([], 0);
      doc.link(x, y - 5, 192 - x, 7, { pageNumber: pg });
    }
    y += e.lvl === 0 ? 8 : 7;
  });
  // numeri di pagina (non sulla copertina)
  const n = doc.getNumberOfPages();
  for (let i = 2; i <= n; i++){ doc.setPage(i); doc.setFont("helvetica", "italic"); doc.setFontSize(8); doc.setTextColor(140, 150, 145); doc.text("De (Nova) Mensa Populari", P.M, 290); doc.text(`${i}/${n}`, 192, 290, { align: "right" }); }
  const tutto = recipes.length === VIS().length && menus.length === store.menus.length && S.app.size === ELETTRO().length;
  offer(doc, tutto ? "De (Nova) Mensa Populari" : "De (Nova) Mensa Populari - selezione", status);
}

function shoppingList(m){

  const out = new Map();

    if (i.base || !i.k || i.k.some(k => frigo.has(k))) continue;

    if (!out.has(key)) out.set(key, { nome: i.k.join(" o "), per: new Set() });

function route(){
  const h = location.hash.slice(1);

  if (h === "scarica") return renderScarica();
  if (h === "impostazioni") return renderImpostazioni();
  if (h === "menu-nuovo"){
    if (!state.draft) state.draft = { step: 1, frigo: new Set(), piatti: new Set(), nome: "Menù del " + new Date().toLocaleDateString("it-IT", { day: "numeric", month: "long" }) };
    return renderWizard();
  }
  if (h.startsWith("menu-")){
    const m = findMenu(h.slice(5));
    if (m) return renderMenu(m);
    if (!store.ready){ app.innerHTML = masthead("menu") + `<p class="empty">Carico il menù…</p>`; return; }
    return renderMenus();
  }
  const r = RICETTE.find(x => x.id === h);

  renderList();
}
