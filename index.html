  else if (a === "meno"){ if (t.stato === "va") t.fine = Math.max(Date.now(), t.fine - 60000); else { t.resto = Math.max(1000, t.resto - 60000); } }
  else if (a === "del") TM.list = TM.list.filter(x => x.id !== id);
  tmSave(); tmRender(); }
function tmBadge(){ const n = TM.list.filter(t => t.stato === "va" || t.stato === "suona").length; document.querySelectorAll(".tm-badge").forEach(b => { b.hidden = !n; b.textContent = n; }); }
function tmDock(){ let d = document.getElementById("tm-dock"); if (!d){ d = document.createElement("div"); d.id = "tm-dock"; d.className = "tm-dock"; document.body.appendChild(d); }
  const vis = TM.open ? [] : TM.list.filter(t => t.stato !== "fermo");
  const sig = vis.map(t => t.id + t.stato + t.nome).join("|");
  if (d.dataset.sig === sig){ vis.forEach(t => { const p = d.querySelector(`[data-tm-pill="${t.id}"] .lcd`); if (p) p.outerHTML = seg(tmFmt(tmLeft(t)), 22); }); return; }
  d.dataset.sig = sig;
  d.innerHTML = vis.map(t => `<button class="tm-pill ${t.stato === "suona" ? "tm-ring" : t.stato}" data-tm-pill="${t.id}" aria-label="${esc(t.nome)}${t.stato === "suona" ? ": tempo scaduto, tocca per spegnere" : ""}"><span class="tm-n">${esc(t.nome)}</span>${seg(tmFmt(tmLeft(t)), 22)}</button>`).join(""); }
function tmSheet(){ let m = document.getElementById("tm-modal");
  if (!TM.open){ if (m) m.remove(); return; }
  if (!m){ m = document.createElement("div"); m.id = "tm-modal"; m.className = "tm-modal"; m.innerHTML = `<div class="tm-sheet" role="dialog" aria-modal="true" aria-labelledby="tm-t"><div class="tm-head"><h2 id="tm-t">Timer</h2><button class="tm-x" data-tm-close aria-label="Chiudi">×</button></div>
    <div class="tm-comp"><input id="tm-nome" class="tm-name" placeholder="Nome del timer (es. Pasta)" maxlength="30" aria-label="Nome del nuovo timer" enterkeyhint="next">
      <div class="tm-big" id="tm-disp" aria-live="polite"></div>
      <p class="tm-hint tm-kbd">Digita ore, minuti e secondi con la tastiera (es. 1030 = 10 min 30 s), Invio per avviare.</p>
      <div class="tm-pad">${["1","2","3","4","5","6","7","8","9","00","0","⌫"].map(k => `<button type="button" data-tm-key="${k}" aria-label="${k === "⌫" ? "Cancella" : k}">${k}</button>`).join("")}</div>
      <button type="button" class="tm-go" data-tm-start>Avvia</button></div><div id="tm-list"></div>
    <p class="tm-note">I timer restano solo su questo dispositivo e suonano anche a schermo spento, purché l'app non sia chiusa del tutto.</p></div>`;
    document.body.appendChild(m);
    m.querySelector("#tm-nome").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); e.target.blur(); } });
    tmComp();
    m.addEventListener("click", e => { if (e.target === m) tmClose(); });
  }
  const L = m.querySelector("#tm-list");
  const sig = TM.list.map(t => t.id + t.stato + t.nome).join("|");
  if (L.dataset.sig !== sig && !(L.contains(document.activeElement) && document.activeElement.tagName === "INPUT")){ L.dataset.sig = sig; L.innerHTML = TM.list.map(t => `<div class="tm-card ${t.stato}${t.stato === "suona" ? " tm-ring" : ""}" data-tm="${t.id}">
      <div class="tm-top"><input class="tm-name" value="${esc(t.nome)}" aria-label="Nome del timer" maxlength="30"><span class="tm-big">${seg(tmFmt(tmLeft(t)), 34)}</span></div>
      <div class="tm-btns">${t.stato === "suona" ? `<button class="go wide" data-tm-a="stop">Spegni</button><button data-tm-a="piu">+1 min</button>` : `<button data-tm-a="meno" aria-label="Togli un minuto">−1</button>${t.stato === "va" ? `<button class="wide" data-tm-a="pausa">Pausa</button>` : `<button class="go wide" data-tm-a="via">${t.stato === "pausa" ? "Riprendi" : "Avvia"}</button>`}<button data-tm-a="piu" aria-label="Aggiungi un minuto">+1</button><button data-tm-a="reset" aria-label="Azzera">↺</button>`}${telSveglia() !== "no" && t.stato === "va" ? `<a class="tm-tel" href="#" data-tm-tel title="Avvia lo stesso tempo sul timer del telefono" aria-label="Metti il tempo che resta sul timer del telefono">⏰</a>` : ""}<button class="del" data-tm-a="del" aria-label="Elimina timer">✕</button></div></div>`).join("") || ""; }
  else L.querySelectorAll("[data-tm]").forEach(c => { const t = TM.list.find(x => x.id === c.dataset.tm); if (t) c.querySelector(".tm-big").innerHTML = seg(tmFmt(tmLeft(t)), 34); }); }
TM.dig = "";
function tmCompMs(){ const d = TM.dig.padStart(6, "0"); return ((+d.slice(0, 2) * 60 + +d.slice(2, 4)) * 60 + +d.slice(4)) * 1000; }
function tmComp(){ const el = document.getElementById("tm-disp"); if (!el) return; const d = TM.dig.padStart(6, "0");
  el.innerHTML = seg(`${d.slice(0, 2)}:${d.slice(2, 4)}:${d.slice(4)}`, 52); el.classList.toggle("vuoto", !TM.dig);
  const go = document.querySelector("[data-tm-start]"); if (go) go.disabled = !TM.dig; }
function tmKey(k){ if (k === "⌫") TM.dig = TM.dig.slice(0, -1); else { TM.dig = (TM.dig + k).replace(/^0+/, "").slice(0, 6); } tmComp(); }
function telSveglia(){ try { return localStorage.getItem("ricettario-telsveglia") || "no"; } catch (e){ return "no"; } }
function telUrl(nome, ms){ const sec = Math.max(1, Math.round(ms / 1000)), tipo = telSveglia();
  if (tipo === "iphone") return `shortcuts://run-shortcut?name=${encodeURIComponent("Timer Mensa")}&input=text&text=${sec}`;
  if (tipo === "android") return `intent:#Intent;action=android.intent.action.SET_TIMER;i.android.intent.extra.alarm.LENGTH=${sec};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(nome || "Timer")};B.android.intent.extra.alarm.SKIP_UI=true;end`;
  return ""; }
function tmToast(txt){ let t = document.getElementById("tm-toast"); if (!t){ t = document.createElement("div"); t.id = "tm-toast"; t.className = "tm-toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = txt; t.classList.add("on"); clearTimeout(TM.toastT); TM.toastT = setTimeout(() => t.classList.remove("on"), 4500); }
function telApri(nome, ms){
  if (telSveglia() === "iphone"){ const sec = Math.max(1, Math.round(ms / 1000));
    const fuoriClaude = !(window.claude && window.claude.use);
    try { navigator.clipboard.writeText(String(sec)).then(() => { if (fuoriClaude){ const home = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
        const back = encodeURIComponent(location.href.split("#")[0]);
        /* dall'icona sulla Home il ritorno automatico riaprirebbe Safari: lì si torna con il "◀" in alto a sinistra */
        location.href = home ? "shortcuts://run-shortcut?name=" + encodeURIComponent("Timer Mensa") : "shortcuts://x-callback-url/run-shortcut?name=" + encodeURIComponent("Timer Mensa") + "&x-success=" + back + "&x-cancel=" + back + "&x-error=" + back; } else tmToast("Pronto per il timer dell'iPhone: esci dall'app e parte da solo."); }, () => tmToast("Non riesco a copiare negli appunti: tocca ⏰ sulla riga del timer.")); } catch (e) { tmToast("Non riesco a copiare negli appunti."); }
    return; }
  const u = telUrl(nome, ms); if (!u) return; const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); try { a.click(); } catch (e) {} a.remove(); }
function tmStart(){ const ms = tmCompMs(); if (!ms) return; const n = document.getElementById("tm-nome"); tmAdd(n ? n.value.trim() : "", ms, true); telApri(TM.list[TM.list.length - 1].nome, ms); if (n) n.value = ""; TM.dig = ""; tmComp(); }
function tmRender(){ tmBadge(); tmDock(); tmSheet(); }
function tmOpenSheet(){ TM.open = true; tmRender(); }
function tmClose(){ TM.open = false; tmRender(); }
document.addEventListener("click", e => {
  if (e.target.closest("[data-timer-open]")){ tmOpenSheet(); return; }
  if (e.target.closest("[data-tm-close]")){ tmClose(); return; }
  const pill = e.target.closest("[data-tm-pill]"); if (pill){ const t = TM.list.find(x => x.id === pill.dataset.tmPill); if (t && t.stato === "suona") tmAct(t.id, "stop"); else tmOpenSheet(); return; }
  const k = e.target.closest("[data-tm-key]"); if (k){ tmKey(k.dataset.tmKey); return; }
  if (e.target.closest("[data-tm-start]")){ tmStart(); return; }
  const tel = e.target.closest("[data-tm-tel]"); if (tel){ const t = TM.list.find(x => x.id === tel.closest("[data-tm]").dataset.tm); if (t && telSveglia() === "iphone"){ e.preventDefault(); telApri(t.nome, tmLeft(t)); return; } const u = t && telUrl(t.nome, tmLeft(t)); if (u){ tel.href = u; tel.target = "_blank"; } else e.preventDefault(); return; }
  const b = e.target.closest("[data-tm-a]"); if (b){ tmAct(b.closest("[data-tm]").dataset.tm, b.dataset.tmA); }
});
document.addEventListener("change", e => { if (e.target.classList.contains("tm-name") && e.target.closest("[data-tm]")){ const t = TM.list.find(x => x.id === e.target.closest("[data-tm]").dataset.tm); if (t){ t.nome = e.target.value.trim() || t.nome; tmSave(); } } });
document.addEventListener("keydown", e => { if (!TM.open) return;
  if (e.key === "Escape"){ tmClose(); return; }
  if (e.target.matches && e.target.matches("input, textarea")) return;
  if (/^[0-9]$/.test(e.key)){ e.preventDefault(); tmKey(e.key); }
  else if (e.key === "Backspace"){ e.preventDefault(); tmKey("⌫"); }
  else if (e.key === "Delete"){ TM.dig = ""; tmComp(); }
  else if (e.key === "Enter"){ e.preventDefault(); tmStart(); } });
function tmTick(){ let ring = false, changed = false;
  TM.list.forEach(t => { if (t.stato === "va" && t.fine <= Date.now()){ t.stato = "suona"; t.resto = 0; changed = true; } if (t.stato === "suona") ring = true; });
  if (changed){ tmSave(); tmRender(); } else { tmBadge(); tmDock(); if (TM.open) tmSheet(); }
  tmMedia();
  if (ring && !soloTel() && Date.now() - (TM.vibAt || 0) > 1200){ TM.vibAt = Date.now(); try { navigator.vibrate && navigator.vibrate([300, 120, 300, 120, 300]); } catch (e) {} }
  if (IOS) return;
  const late = TM.list.some(t => t.stato === "suona" && Date.now() - t.fine > 59000);
  if (ring && late && Date.now() - TM.beepAt > 1200){ TM.beepAt = Date.now(); tmBeep(); } }
tmLoad(); setInterval(tmTick, 250);

window.addEventListener("hashchange", () => { state.confirmDel = null; route(); window.scrollTo(0, 0); });
route();
chiediProfilo();

function useLocal(){
  store.local = true;
  try { store.menus = JSON.parse(localStorage.getItem("ricettario-menu") || "[]"); } catch (e){ store.menus = []; }
  store.ready = true;
}
function refreshMenuViews(){ const h = location.hash.slice(1); if (h === "scarica" && state.sel){ store.menus.forEach(m => { if (!state.sel.seen) state.sel.menu.add(m.id); }); state.sel.seen = true; } if (h === "menu" || h === "scarica" || (h.startsWith("menu-") && h !== "menu-nuovo")) route(); }

(async function init(){
  if (!(window.claude && window.claude.use)){
    downloads = { save: async ({ filename, data }) => { const a = document.createElement("a"); a.href = URL.createObjectURL(data); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); } };
    useLocal(); refreshMenuViews(); const h = location.hash.slice(1); if (h && h !== "menu" && h !== "menu-nuovo") route(); return; }
  claude.use("downloads").then(d => { downloads = d; const h = location.hash.slice(1); if (h && h !== "menu" && h !== "menu-nuovo") route(); }).catch(() => {});
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    try { isOwner = user ? !!(await user.isOwner()) : false; } catch (e){ isOwner = false; }
    if (db){
      titoliRef = db.doc("ricettario/titoli");
      titoliRef.onSnapshot(s => {
        const t = s.exists && s.data().t && typeof s.data().t === "object" ? s.data().t : {};
        RICETTE.forEach(r => { r.titolo = typeof t[r.id] === "string" && t[r.id].trim() ? t[r.id].trim().slice(0, 120) : r.titoloOrig; });
        if (!(document.activeElement && document.activeElement.tagName === "INPUT") && location.hash !== "#menu-nuovo") route();
      }, () => {});
      cestinoRef = db.doc("ricettario/cestino");
      cestinoRef.onSnapshot(s => {
        const ids = s.exists && Array.isArray(s.data().ids) ? s.data().ids : [];
        cestino.clear(); ids.forEach(i => cestino.add(i));
        if (!(document.activeElement && document.activeElement.tagName === "INPUT") && location.hash !== "#menu-nuovo") route();
      }, () => {});
      if (!location.hash || RICETTE.some(r => "#" + r.id === location.hash)) route();
    }
    const uid = db && user ? await user.id() : null;
    if (!uid){ useLocal(); refreshMenuViews(); return; }
    store.ref = db.doc("data/users/" + uid + "/menus");
    store.prefsRef = db.doc("data/users/" + uid + "/prefs");
    store.prefsRef.onSnapshot(s => { const p = s.exists ? s.data().prezzo : null; if (typeof p === "number" && p > 0 && p < 5 && p !== state.prezzo){ state.prezzo = p; try { localStorage.setItem("ricettario-prezzo", String(p)); } catch (e) {} if (!(document.activeElement && document.activeElement.tagName === "INPUT")) route(); } }, () => {});
    const timer = setTimeout(() => { store.note = "I menù non sono ancora raggiungibili: potrebbero non essere aggiornati."; refreshMenuViews(); }, 10000);
    store.ref.onSnapshot(s => {
      if (!s.metadata.fromCache){ clearTimeout(timer); store.note = ""; }
      const data = s.exists ? s.data() : null;
      store.menus = data && Array.isArray(data.list) ? data.list.map(m => ({ ...m, piatti: [...(m.piatti || [])], frigo: [...(m.frigo || [])] })) : [];
      store.ready = true; refreshMenuViews();
    }, () => { clearTimeout(timer); store.ref = null; useLocal(); refreshMenuViews(); });
  } catch (e){ useLocal(); refreshMenuViews(); }
})();
</script>
